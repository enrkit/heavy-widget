name: Sync Instagram Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fetch Instagram media
        id: fetch
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_MEDIA_LIMIT: '12'
        run: node scripts/fetch-instagram.mjs

      - name: Commit updated feed
        run: |
          git config user.name "instagram-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/feed.json data/images
          git diff --cached --quiet || git commit -m "chore: sync instagram feed"
          git push

      - name: Purge jsDelivr cache for feed.json
        run: curl -s "https://purge.jsdelivr.net/gh/enrkit/heavy-widget@main/data/feed.json"

      - name: Rotate IG_ACCESS_TOKEN secret if refreshed
        if: steps.fetch.outputs.token_refreshed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN: ${{ steps.fetch.outputs.new_token }}
        run: |
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" --body "$NEW_TOKEN"
